spring:
  application:
    name: ticker

  # 카카오 OAuth2 로그인 설정
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: a09d9b25f21e10aec5a13d293e961fe7
            client-secret: ${KAKAO_CLIENT_SECRET:}
            scope:
              - profile_nickname
              - profile_image
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    # H2 Database (File-based) - 서버 재시작해도 데이터 유지
    url: jdbc:h2:file:./data/ticker_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console    
    # MySQL (Commented out)
    # url: jdbc:mysql://localhost:3306/ticker_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    # driver-class-name: com.mysql.cj.jdbc.Driver
    # username: root
    # password: 1234 

  jpa:
    hibernate:
      ddl-auto: update 
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # dialect: org.hibernate.dialect.MySQLDialect
        dialect: org.hibernate.dialect.H2Dialect

server:
  # 8080이 사용 중이면: server.port=8081 로 변경하거나 환경변수 SERVER_PORT=8081
  port: ${SERVER_PORT:8080}

# 카카오 로그인 후 리다이렉트 URI (Swift 앱: ticker://oauth, 웹: http://localhost:3000/oauth)
app:
  oauth:
    redirect-uri: ticker://oauth