# 카카오 로그인 설정 예시
# 이 파일을 복사하여 application-oauth.yml 생성 후 실제 키 입력
# 또는 환경변수로 설정: KAKAO_REST_API_KEY, KAKAO_CLIENT_SECRET, OAUTH_REDIRECT_URI

spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: your_rest_api_key_here
            client-secret: your_client_secret_if_enabled

app:
  oauth:
    # Swift 앱: ticker://oauth
    # 웹: http://localhost:3000/oauth
    redirect-uri: ticker://oauth
