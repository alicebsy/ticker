spring:
  application:
    name: ticker

  # 카카오 OAuth2 로그인 설정
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: a09d9b25f21e10aec5a13d293e961fe7
            client-secret: ${KAKAO_CLIENT_SECRET:}
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    # localhost:3306 -> 내 맥북의 도커 MySQL 포트
    # ticker_db -> 데이터베이스 이름 (없으면 자동 생성 옵션 추가함)
    url: jdbc:mysql://localhost:3306/ticker_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: root
    password: 1234 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # create-drop: 껐다 켜면 데이터 삭제 (비추천)
      # update: 껐다 켜도 데이터 유지 + 스키마 변경사항만 반영 (추천!)
      ddl-auto: update 
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  # 8080이 사용 중이면: server.port=8081 로 변경하거나 환경변수 SERVER_PORT=8081
  port: ${SERVER_PORT:8080}

# 카카오 로그인 후 리다이렉트 URI (Swift 앱: ticker://oauth, 웹: http://localhost:3000/oauth)
app:
  oauth:
    redirect-uri: http://localhost:8080/login/oauth2/code/kakao